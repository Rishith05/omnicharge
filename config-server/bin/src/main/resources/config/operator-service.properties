# Operator Service Configuration

# Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/omnicharge_operator_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.data.redis.connect-timeout=1000

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Resilience4J Circuit Breaker Config for Redis
resilience4j.circuitbreaker.instances.redis.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.redis.slidingWindowSize=10
resilience4j.circuitbreaker.instances.redis.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.redis.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.redis.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.redis.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.redis.failureRateThreshold=50

# Numverify API Configuration
numverify.api.key=${NUMVERIFY_API_KEY:placeholder}
numverify.api.url=http://apilayer.net/api/validate

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
