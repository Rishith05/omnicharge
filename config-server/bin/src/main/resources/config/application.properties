# ==========================================
# CENTRALIZED GLOBAL CONFIGURATION
# ==========================================
# Loaded by ALL services via Spring Cloud Config Server.

# --- Eureka Instance Configuration ---
# Use IP address for registration so the gateway can resolve services
eureka.instance.prefer-ip-address=true

# --- Zipkin Distributed Tracing ---
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0
# Disable auto-export so services don't spam errors when Zipkin is offline
management.tracing.enabled=${TRACING_ENABLED:false}

# --- Actuator & Prometheus ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# --- Swagger / OpenAPI ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
