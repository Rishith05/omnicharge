# User Service Configuration

# Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/omnicharge_user_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.data.redis.connect-timeout=1000

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# JWT Configuration - MUST MATCH API GATEWAY EXACTLY
jwt.secret=${JWT_SECRET:omnicharge-super-secret-key-for-jwt-token-generation-minimum-256-bits}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:placeholder}
google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}

# JavaMail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_APP_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logging
logging.level.com.omnicharge.user=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.mail.enabled=false



# Admin Configuration
# Only this mobile number gets ROLE_ADMIN privileges
admin.mobile-number=${ADMIN_MOBILE_NUMBER:8688179553}

# Twilio SMS Configuration
TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:placeholder}
TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:placeholder}
TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:+10000000000}

