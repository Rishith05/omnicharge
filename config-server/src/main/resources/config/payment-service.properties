# Payment Service Configuration

# Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/omnicharge_payment_db?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_live_SUvKCS3WVGspwp}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:m0Cbz6xf3LuM3YzeDq6Kjv5L}

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.razorpayService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.razorpayService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.razorpayService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.razorpayService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.razorpayService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.razorpayService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.razorpayService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.razorpayService.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.razorpayService.slowCallDurationThreshold=5s

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
